          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: 0.5 }}
          className="bg-[#f2f5f6] relative rounded-[40px] shrink-0 w-full max-w-[440px]"
        >
          <div className="content-stretch flex flex-col items-start p-[40px] relative w-full">
            <div className="content-stretch flex flex-col items-start pb-[40px] relative shrink-0 w-full">
              <div className="content-stretch flex flex-col gap-[24px] items-start overflow-clip relative shrink-0 w-full">
                <div className="content-stretch flex flex-col items-start relative shrink-0 w-full">
                  <div className="content-stretch flex flex-col gap-[24px] items-start relative shrink-0 w-full">
                    <div className="content-stretch flex flex-col gap-[16px] items-start relative shrink-0 w-full">
                      <p className="font-['Sage_Text:Medium',sans-serif] leading-[1.4] not-italic relative shrink-0 text-[14px] text-[rgba(0,0,0,0.65)] w-full whitespace-pre-wrap">
                        {product.category}
                      </p>
                      <p className="font-['Sage_Headline:Black',sans-serif] leading-[0] not-italic relative shrink-0 text-[32px] text-[rgba(0,0,0,0.9)] w-full whitespace-pre-wrap">
                        <span className="leading-[1.4]">
                          {product.title}
                          <br />
                        </span>
                        <span
                          className="bg-clip-text leading-[1.4]"
                          style={{
                            backgroundImage: "linear-gradient(60.9117deg, rgb(19, 160, 56) 1.6956%, rgb(0, 146, 219) 6.4822%, rgb(47, 122, 230) 18.56%, rgb(143, 73, 254) 28.678%)",
                            WebkitTextFillColor: "transparent"
                          }}
                        >
                          {product.subtitle}
                        </span>
                      </p>
                      <div className="content-stretch flex flex-col gap-[16px] items-start relative shrink-0 w-full">
                        <div className="content-stretch flex flex-col gap-[16px] items-start relative shrink-0 w-full">
                          <div className="font-['Sage_Text:Regular',sans-serif] leading-[1.6] not-italic relative shrink-0 text-[18px] text-[rgba(0,0,0,0.9)] w-full whitespace-pre-wrap">
                            <p className="mb-[16px]">{product.description}</p>
                            <p className="font-['Sage_Text:Bold',sans-serif]">
                              {product.features}
                            </p>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div className="content-start flex flex-wrap gap-[16px] items-start relative shrink-0 w-full">
                      <button className="bg-black content-stretch flex items-center justify-center px-[16px] py-[13px] relative rounded-[24px] shrink-0 hover:bg-[#00d639] transition-colors">
                        <div className="flex flex-col font-['Sage_Text:Medium',sans-serif] justify-center leading-[0] not-italic relative shrink-0 text-[16px] text-[rgba(255,255,255,0.9)] text-center whitespace-nowrap">
                          <p className="leading-[1.4]">{product.button}</p>
                        </div>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div className="content-stretch flex flex-col items-center relative shrink-0 w-full">
              <div className="h-[267px] overflow-clip relative shrink-0 w-[404px]">
                <div className="absolute left-[50%] top-[50%] -translate-x-1/2 -translate-y-1/2 blur-[20px] h-[121px] w-[304px]" style={{ backgroundImage: "linear-gradient(-46.8073deg, rgb(143, 73, 254) 65.629%, rgb(17, 175, 255) 23.116%, rgb(0, 214, 57) 94.112%)" }} />
                <div className="absolute left-[22px] top-[20px] h-[227px] w-[360px] bg-white rounded-[12px] p-[20px]">
                  <p className="font-['Sage_UI:Bold',sans-serif] leading-[normal] not-italic text-[16px] text-black mb-[20px]">
                    {type === 'individual' ? 'Self Assessment Tax Returns' : type === 'accounting' ? 'Sales Invoice' : 'CFO Dashboard'}
                  </p>
                  <div className="bg-[#f2f5f6] h-[140px] w-full rounded-[8px] p-[20px] flex items-center justify-center">
                    <span className="text-[#00d639] font-['Sage_UI:Bold',sans-serif] text-[24px]">
                      {type === 'individual' ? '✓ Submitted' : type === 'accounting' ? '£168.00 Paid' : 'AI Insights'}
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </motion.div>
      );
    }

    // Main App Component
    function App() {
      const [selectedOption, setSelectedOption] = useState(null);
      const [vatStatus, setVATStatus] = useState(null);
      const [employeeCount, setEmployeeCount] = useState(null);
      const [showResults, setShowResults] = useState(false);
      const [quizStep, setQuizStep] = useState(1);

      const handleOptionClick = (option) => {
        setSelectedOption(option);
        
        if (option === "sole-trader" || option === "other") {
          setTimeout(() => {
            setQuizStep(2);
          }, 500);
        } else if (option === "limited-company") {
          setTimeout(() => {
            setQuizStep(3);
          }, 500);
        }
      };

      const handleVATClick = (vat) => {
        setVATStatus(vat);
        setTimeout(() => {
          setShowResults(true);
        }, 500);
      };

      const handleEmployeeClick = (count) => {
        setEmployeeCount(count);
        setTimeout(() => {
          setShowResults(true);
        }, 500);
      };

      const handleBackClick = () => {
        if (quizStep === 2) {
          setQuizStep(1);
          setVATStatus(null);
        } else if (quizStep === 3) {
          setQuizStep(1);
          setEmployeeCount(null);
        }
      };

      const getProgress = () => {
        if (quizStep === 1 && !selectedOption) return 23;
        if (quizStep === 1 && selectedOption) return 50;
        if (quizStep === 2 && !vatStatus) return 66;
        if (quizStep === 2 && vatStatus && !showResults) return 83;
        return 100;
      };

      const getRecommendedProducts = () => {
        switch (selectedOption) {
          case "sole-trader":
            return ["individual"];
          case "limited-company":
            return ["accounting"];
          case "other":
            return ["intacct"];
          default:
            return [];
        }
      };

      return (
        <div className="min-h-screen bg-black">
          {/* Hero Section */}
          <div className="relative shrink-0 w-full">
            <div className="content-stretch flex flex-col items-start px-[240px] relative w-full">
              <div className="relative shrink-0 w-full">
                <div className="content-stretch flex flex-col items-start px-[80px] relative w-full py-[80px]">
                  <div className="content-stretch flex flex-col items-start relative shrink-0 w-full">
                    <div className="content-stretch flex flex-col gap-[40px] items-start relative shrink-0 w-full">
                      <div className="content-stretch flex flex-col gap-[32px] items-start relative shrink-0 w-full">
                        <div className="content-stretch flex flex-col gap-[24px] items-start relative shrink-0 w-full">
                          <div className="content-stretch flex flex-col gap-[16px] items-start relative shrink-0 w-full">
                            <p className="font-['Sage_Headline:Black',sans-serif] leading-[1.2] not-italic relative shrink-0 text-[50px] text-[rgba(255,255,255,0.9)] text-center w-full whitespace-pre-wrap">
                              Easy-to-use online accounting software
                            </p>
                          </div>
                          <div className="content-stretch flex flex-col items-start relative shrink-0 w-full">
                            <div className="content-stretch flex flex-col gap-[16px] items-start relative shrink-0 w-full">
                              <p className="font-['Sage_Text:Regular',sans-serif] leading-[1.6] not-italic relative shrink-0 text-[22px] text-[rgba(255,255,255,0.9)] text-center w-full whitespace-pre-wrap">
                                Whether you are a sole trader, small business or a medium-sized business, we have your accounting needs covered. Our cloud accounting software is easy to use, secure, and customisable to your needs.
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Quiz Section */}
          <div className="relative rounded-[40px] shrink-0 w-full">
            <div className="content-stretch flex flex-col items-start pb-[49px] pt-[40px] px-[40px] relative w-full">
              <div className="mb-[-9px] relative rounded-[40px] shrink-0 w-full">
                <div className="content-stretch flex items-center justify-center px-[240px] relative w-full">
                  <div className="content-stretch flex flex-col gap-[8px] items-center justify-center relative shrink-0">
                    <div className="content-stretch flex flex-col items-center justify-center relative shrink-0 w-full">
                      {/* Question Header */}
                      <div className="content-stretch flex flex-col gap-[8px] items-start relative shrink-0 w-full mb-[24px]">
                        <div className="content-stretch flex gap-[4px] items-center justify-center relative shrink-0 w-full">
                          <p className="font-['Sage_Text:Medium',sans-serif] leading-[1.4] not-italic relative shrink-0 text-[18px] text-[rgba(255,255,255,0.85)] text-center">
                            Find the right Sage accounting software for your business
                          </p>
                          {(quizStep === 2 || quizStep === 3) && (
                            <button
                              onClick={handleBackClick}
                              className="relative shrink-0 w-[24px] h-[24px] p-[4px] rounded-[8px] hover:bg-[#303030] transition-colors"
                            >
                              <div aria-hidden="true" className="absolute border border-[#474747] border-solid inset-0 pointer-events-none rounded-[8px]" />
                              <svg className="block w-full h-full" fill="none" preserveAspectRatio="none" viewBox="0 0 24 24">
                                <path d={svgPaths.p11b50e60} fill="rgba(255,255,255,0.9)" />
                              </svg>
                            </button>
                          )}
                        </div>
                        <p className="font-['Sage_Headline:Black',sans-serif] leading-[1.4] not-italic relative shrink-0 text-[32px] text-[rgba(255,255,255,0.95)] text-center w-full whitespace-pre-wrap">
                          {quizStep === 1 ? "How is your business structured?" : quizStep === 2 ? "Do you pay VAT?" : "How many employees do you have?"}
                        </p>
                      </div>

                      {/* Progress Bar */}
                      <div className="h-[24px] shrink-0 w-[766px]" />
                      <ProgressBar progress={getProgress()} />
                      <div className="h-[40px] shrink-0 w-[766px]" />

                      {/* Options */}
                      <AnimatePresence mode="wait">
                        {!showResults && quizStep === 1 && (
                          <motion.div
                            initial={{ opacity: 1 }}
                            exit={{ opacity: 0, y: -20 }}
                            transition={{ duration: 0.3 }}
                            className="content-stretch flex gap-[40px] items-center justify-center relative shrink-0 w-full"
                          >
                            <QuizOption
                              icon="person"
                              label="Sole Trader"
                              onClick={() => handleOptionClick("sole-trader")}
                              isSelected={selectedOption === "sole-trader"}
                            />
                            <QuizOption
                              icon="bag"
                              label="Limited Company"
                              onClick={() => handleOptionClick("limited-company")}
                              isSelected={selectedOption === "limited-company"}
                            />
                            <QuizOption
                              icon="home"
                              label="Other"
                              onClick={() => handleOptionClick("other")}
                              isSelected={selectedOption === "other"}
                            />
                          </motion.div>
                        )}

                        {!showResults && quizStep === 2 && (
                          <motion.div
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            exit={{ opacity: 0, y: -20 }}
                            transition={{ duration: 0.3 }}
                            className="content-stretch flex gap-[40px] items-center justify-center relative shrink-0 w-full"
                          >
                            <VATOption
                              type="yes"
                              label="Yes, I'm VAT registered"
                              onClick={() => handleVATClick("yes")}
                              isSelected={vatStatus === "yes"}
                            />
                            <VATOption
                              type="no"
                              label="No, I'm not VAT registered"
                              onClick={() => handleVATClick("no")}
                              isSelected={vatStatus === "no"}
                            />
                          </motion.div>
                        )}

                        {!showResults && quizStep === 3 && (
                          <motion.div
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            exit={{ opacity: 0, y: -20 }}
                            transition={{ duration: 0.3 }}
                            className="content-stretch flex gap-[40px] items-center justify-center relative shrink-0 w-full"
                          >
                            <EmployeeOption
                              type="0-19"
                              label="0-19 employees"
                              onClick={() => handleEmployeeClick("0-19")}
                              isSelected={employeeCount === "0-19"}
                            />
                            <EmployeeOption
                              type="20+"
                              label="20+ employees"
                              onClick={() => handleEmployeeClick("20+")}
                              isSelected={employeeCount === "20+"}
                            />
                          </motion.div>
                        )}
                      </AnimatePresence>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Results Section */}
          <AnimatePresence>
            {showResults && (
              <motion.div
                initial={{ opacity: 0, y: 50 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.6, delay: 0.2 }}
                className="relative w-full"
              >
                <div className="content-stretch flex items-center justify-center pb-[24px] px-[240px] relative shrink-0 w-full">
                  <p className="font-['Sage_Text:Medium',sans-serif] leading-[1.4] not-italic relative shrink-0 text-[18px] text-[rgba(255,255,255,0.85)] text-center">
                    All accounting solutions
                  </p>
                </div>
                <div className="flex flex-wrap gap-[40px] items-start justify-center px-[240px] pb-[80px]">
                  {getRecommendedProducts().map((product, index) => (
                    <motion.div
                      key={product}
                      initial={{ opacity: 0, y: 30 }}
                      animate={{ opacity: 1, y: 0 }}
                      transition={{ duration: 0.5, delay: 0.4 + index * 0.1 }}
                    >
                      <ProductCard type={product} />
                    </motion.div>
                  ))}
                </div>

                {/* Show all products button */}
                <motion.div
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  transition={{ duration: 0.5, delay: 0.8 }}
                  className="flex justify-center pb-[80px]"
                >
                  <button
                    onClick={() => {
                      setSelectedOption(null);
                      setVATStatus(null);
                      setEmployeeCount(null);
                      setQuizStep(1);
                      setShowResults(false);
                    }}
                    className="bg-[#00d639] hover:bg-[#00b82f] transition-colors content-stretch flex items-center justify-center px-[24px] py-[16px] relative rounded-[24px] shrink-0"
                  >
                    <div className="flex flex-col font-['Sage_Text:Medium',sans-serif] justify-center leading-[0] not-italic relative shrink-0 text-[16px] text-black text-center whitespace-nowrap">
                      <p className="leading-[1.4]">Start Over</p>
                    </div>
                  </button>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
